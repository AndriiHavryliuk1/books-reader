<form novalidate (submit)="onSubmit($event)">
  <h2 mat-dialog-title>{{ isEdit() ? 'Edit book' : 'Add book' }}</h2>

  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput [formField]="bookForm.name" cdkFocusInitial />
      <mat-error>{{ bookForm.name().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Author</mat-label>
      <input matInput [formField]="bookForm.author" />
      <mat-error>{{ bookForm.author().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Number of pages</mat-label>
      <input matInput type="number" step="1" [formField]="bookForm.pageCount" />
      <mat-error>{{ bookForm.pageCount().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    @if (saveError()) {
      <p class="save-error">{{ saveError() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="saving()">Save</button>
  </mat-dialog-actions>
</form>
